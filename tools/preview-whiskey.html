<title>The Whiskey Expert</title>
<style>
/* =========================================================================
   BrunnenBar — house theme
   =========================================================================
   The shared look for every BrunnenBar recommender. Nothing in this file
   knows about cocktails, whiskey or tequila. Copy it verbatim into a new app,
   link it first, then put whatever that app needs on its own in a second
   stylesheet after it.

   Mobile-first throughout. Most guests open these on a phone, at a table, in
   low light. Large tap targets, high contrast, no hover-only affordances.

   Full explanation and copy-paste recipes: docs/design-system.md
   ========================================================================= */

:root {
  /* Grounds. BrunnenBar's forest green driven right down to a near-black, so
     the page stays dark while still reading as the brand. Every neutral
     carries the same green bias, which is what keeps it from looking like a
     generic dark theme with a gold accent bolted on. Do not swap these for
     grey, that is the single change that would break the whole look. */
  --ink:        #0d1712;   /* page ground */
  --ink-2:      #131f18;   /* cards, options, anything raised off the page */
  --ink-3:      #1a2a20;   /* hover state of a raised surface */
  --line:       #274235;   /* visible border */
  --line-soft:  #1e3327;   /* resting border, dividers */

  /* Champagne gold, straight off the logo and the printed card. The only
     accent. Selection, progress, focus and the primary action are all gold,
     nothing else is. */
  --gold:       #e3c87c;
  --gold-lit:   #f1dda6;   /* hover on a gold fill */
  --gold-deep:  #c9a95c;   /* reserved for gold on light, print, small type */

  /* The card's own green, kept at full strength for secondary marks. Second
     accent only, never competes with gold. */
  --green:      #35664a;
  --green-lit:  #5f9d76;

  --cream:      #f2ece0;   /* body text */
  --muted:      #9aa89b;   /* secondary text */
  --muted-dim:  #6d7c70;   /* labels, disabled, the quietest thing readable */

  --on-gold:    #10201a;   /* text sitting on a gold fill */

  --radius:     14px;      /* options, notices, small cards */
  --radius-lg:  20px;      /* result cards */
  --maxw:       46rem;     /* one column, never wider, on any screen */

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--ink);
  /* Two soft washes, gold from above and green from the lower left. They are
     what stop a flat near-black from looking cheap. Fixed, so scrolling does
     not drag them. */
  background-image:
    radial-gradient(90rem 40rem at 50% -18rem, rgba(227, 200, 124, 0.11), transparent 65%),
    radial-gradient(60rem 40rem at 12% 108%, rgba(53, 102, 74, 0.22), transparent 60%);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Serif for every heading, sans for everything else. That one split does most
   of the work of making it feel like a bar and not a form. */
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; margin: 0; }

.shell {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 1.5rem 1.15rem 4rem;
}

/* ---------------------------------------------------------------- header */

.top {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 1rem;
  padding-bottom: 1.75rem;
}

.lang {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: var(--ink-2);
}

.lang button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 0.42rem 0.8rem;
  cursor: pointer;
  transition: color 0.18s var(--ease), background 0.18s var(--ease);
}

.lang button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.lang button:not([aria-pressed="true"]):hover { color: var(--cream); }

/* ------------------------------------------------------------ transitions */

.stage > * { animation: rise 0.42s var(--ease) both; }

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .stage > *, * { animation: none !important; transition-duration: 0.01ms !important; }
}

/* ----------------------------------------------------------------- intro */

.intro { text-align: center; padding: 1.5rem 0 0; }

.intro h1 { font-size: clamp(2.3rem, 9vw, 3.4rem); }

.rule {
  width: 3.5rem;
  height: 1px;
  background: var(--gold);
  border: 0;
  margin: 1.5rem auto;
  opacity: 0.6;
}

.lede {
  font-family: var(--serif);
  font-style: italic;
  color: var(--muted);
  max-width: 32rem;
  margin: 0 auto 2.25rem;
  font-size: 1.02rem;
}

/* --------------------------------------------------------------- buttons */

.btn {
  appearance: none;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  border-radius: 999px;
  padding: 0.85rem 2rem;
  border: 1px solid transparent;
  transition: transform 0.15s var(--ease), background 0.18s var(--ease),
              border-color 0.18s var(--ease), color 0.18s var(--ease);
}

.btn:active { transform: translateY(1px); }

/* A link styled as a button still needs the link chrome stripped. */
a.btn { text-decoration: none; display: inline-block; }

.btn-primary { background: var(--gold); color: var(--on-gold); }
.btn-primary:hover { background: var(--gold-lit); }
.btn-primary[disabled] {
  background: var(--ink-3);
  color: var(--muted-dim);
  cursor: not-allowed;
  border-color: var(--line);
}

.btn-ghost { background: transparent; color: var(--muted); border-color: var(--line); }
.btn-ghost:hover { color: var(--cream); border-color: var(--gold); }

.btn-quiet {
  background: none;
  border: 0;
  color: var(--muted-dim);
  font: inherit;
  font-size: 0.9rem;
  text-decoration: underline;
  text-underline-offset: 4px;
  cursor: pointer;
  padding: 0.5rem;
}
.btn-quiet:hover { color: var(--cream); }

.link-card {
  display: inline-block;
  margin-top: 1.5rem;
  color: var(--muted);
  font-size: 0.92rem;
  text-decoration: none;
  border-bottom: 1px solid var(--line);
  padding-bottom: 2px;
}
.link-card:hover { color: var(--gold); border-color: var(--gold); }

/* --------------------------------------------------------------- progress */

.progress { margin-bottom: 2rem; }

.progress-track {
  height: 2px;
  background: var(--line-soft);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--gold);
  width: 0;
  transition: width 0.45s var(--ease);
}

.progress-label {
  margin-top: 0.7rem;
  font-size: 0.74rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted-dim);
}

/* -------------------------------------------------------------- questions */

.q-title { font-size: clamp(1.6rem, 5.5vw, 2.15rem); margin-bottom: 0.6rem; }
.q-sub { color: var(--muted); margin: 0 0 1.75rem; font-size: 0.96rem; }

.options { display: grid; gap: 0.7rem; grid-template-columns: 1fr; }

/* One column on a phone, two from roughly a large phone in landscape up.
   34rem is the only layout breakpoint in the whole theme. */
@media (min-width: 34rem) {
  .options.cols-2 { grid-template-columns: 1fr 1fr; }
  .options.cols-2 .option-wide { grid-column: 1 / -1; }
}

/* An answer of a different kind to the ones above it, such as handing the
   choice back to the bar. Dashed until chosen, so it reads as an aside. */
.option-wide { margin-top: 0.5rem; border-style: dashed; }
.option-wide[aria-pressed="true"] { border-style: solid; }

.option {
  appearance: none;
  text-align: left;
  font: inherit;
  color: var(--cream);
  background: var(--ink-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 1rem 1.15rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.9rem;
  min-height: 3.6rem;   /* thumb-sized, do not shrink */
  transition: border-color 0.18s var(--ease), background 0.18s var(--ease),
              transform 0.12s var(--ease);
}

.option:hover { border-color: var(--gold); background: var(--ink-3); }
.option:active { transform: translateY(1px); }

.option[aria-pressed="true"] {
  border-color: var(--gold);
  background: linear-gradient(180deg, rgba(227, 200, 124, 0.15), rgba(227, 200, 124, 0.06));
}

.option-mark {
  flex: 0 0 auto;
  width: 1.15rem;
  height: 1.15rem;
  border-radius: 50%;
  border: 1.5px solid var(--muted-dim);
  display: grid;
  place-items: center;
  transition: border-color 0.18s var(--ease);
}

.option[aria-pressed="true"] .option-mark { border-color: var(--gold); }

.option-mark::after {
  content: "";
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: var(--gold);
  transform: scale(0);
  transition: transform 0.2s var(--ease);
}

.option[aria-pressed="true"] .option-mark::after { transform: scale(1); }

.option-body { min-width: 0; }
.option-label { font-weight: 600; display: block; }
.option-hint { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 0.12rem; }

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1.9rem;
  flex-wrap: wrap;
}

.nav-right { display: flex; align-items: center; gap: 0.6rem; margin-left: auto; }

/* ----------------------------------------------------------------- scale */
/* An intensity picker. Cocktails use it for strength on six stops, whiskey
   uses it for peat on five, tequila will use it for how much agave shows.
   Three across on a phone, six across once there is room, and an app with a
   different number of stops sets the two variables on its own .scale rather
   than restating the grid. */

.scale {
  display: grid;
  grid-template-columns: repeat(var(--scale-cols-sm, 3), 1fr);
  gap: 0.6rem;
}

@media (min-width: 34rem) {
  .scale { grid-template-columns: repeat(var(--scale-cols, 6), 1fr); }
}

.scale-stop {
  appearance: none;
  font: inherit;
  color: var(--muted);
  background: var(--ink-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 0.85rem 0.4rem 0.7rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  min-height: 4.4rem;
  transition: border-color 0.18s var(--ease), background 0.18s var(--ease),
              color 0.18s var(--ease);
}

.scale-stop:hover { border-color: var(--gold); background: var(--ink-3); }

.scale-stop[aria-pressed="true"] {
  border-color: var(--gold);
  color: var(--cream);
  background: linear-gradient(180deg, rgba(227, 200, 124, 0.15), rgba(227, 200, 124, 0.06));
}

/* Five pips per stop, filled to show intensity. A rising bar was tried first
   and became unreadable the moment the labels wrapped. */
.pips { display: flex; gap: 3px; height: 0.9rem; align-items: center; }

.pip {
  width: 0.34rem;
  height: 0.34rem;
  border-radius: 50%;
  background: var(--line);
  transition: background 0.18s var(--ease), transform 0.18s var(--ease);
}

.pip.on { background: var(--muted-dim); }

.scale-stop[aria-pressed="true"] .pip.on { background: var(--gold); transform: scale(1.25); }

.scale-label { font-size: 0.82rem; font-weight: 600; text-align: center; line-height: 1.2; }

/* --------------------------------------------------------------- results */

.results-head { text-align: center; margin-bottom: 2.25rem; }
.results-head h2 { font-size: clamp(1.9rem, 6.5vw, 2.6rem); }
.results-head p { color: var(--muted); margin: 0.7rem 0 0; font-size: 0.95rem; }

/* Said out loud when the app had to bend a rule to answer at all. Green rule
   on the left, never red, because it is information and not a failure. */
.notice {
  border: 1px solid var(--line);
  border-left: 2px solid var(--green-lit);
  background: var(--ink-2);
  border-radius: var(--radius);
  padding: 0.85rem 1.1rem;
  color: var(--muted);
  font-size: 0.9rem;
  margin-bottom: 1.5rem;
}

.card {
  background: var(--ink-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg);
  padding: 1.5rem 1.35rem;
  margin-bottom: 1rem;
}

/* The top recommendation. Gold edge and a gold wash off the top, so the eye
   lands on it before it reads a word. Exactly one card per screen gets this. */
.card.hero {
  border-color: rgba(227, 200, 124, 0.45);
  background:
    linear-gradient(180deg, rgba(227, 200, 124, 0.07), transparent 45%),
    var(--ink-2);
}

.card-rank {
  font-size: 0.68rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.85rem;
}

.card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

/* A product shot on a result card.
   ---------------------------------------------------------------------------
   The Menu API's images are square, 900 by 900, and often sit on a light or
   transparent ground. So they are CONTAINED and never cropped, because a
   square crop of a bottle takes the neck off, and they are given a ground of
   their own rather than punching a hole in the card. The gold radial behind
   them is the same wash as the page, which makes a product photo read as lit
   on a shelf rather than pasted on.

   Two sizes. `.shot` alone is the full width frame for the favourite.
   `.shot-sm` inside a `.card-lead` row is the thumbnail for a runner up, big
   enough to recognise a bottle by and small enough not to turn a short list
   of suggestions into a catalogue.

   `image` is a URL or null, so the markup is omitted entirely when there is
   no photo. Never a placeholder, and a card with no photo simply has none.

   A photo on a white ground fills the frame and hides the wash, which is
   fine and is what a catalogue cutout will do. The padding keeps a thin mat
   around it so it reads as a framed photo rather than a hole in the card. A
   transparent PNG looks better here, and costs nothing at export time. */
.shot {
  margin: 0;
  overflow: hidden;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  background:
    radial-gradient(62% 62% at 50% 40%, rgba(227, 200, 124, 0.1), transparent 70%),
    var(--ink-3);
}

.shot img {
  display: block;
  width: 100%;
  height: 10rem;
  object-fit: contain;
  padding: 0.75rem;
  box-sizing: border-box;
}

.card > .shot { margin-bottom: 1.15rem; }

.card-lead { display: flex; gap: 0.9rem; align-items: flex-start; }
.card-lead-body { flex: 1; min-width: 0; }

.shot-sm { flex: 0 0 4.6rem; }
.shot-sm img { height: 4.6rem; padding: 0.4rem; }


.card h3 { font-size: clamp(1.5rem, 5vw, 1.95rem); }
.card.alt h3 { font-size: 1.3rem; }

.match {
  font-size: 0.76rem;
  letter-spacing: 0.1em;
  color: var(--muted-dim);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }

.badge {
  font-size: 0.68rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 0.28rem 0.6rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
}

/* Three variants and no more. Gold says the house stands behind it, green
   says it is a property worth knowing, quiet says it is a caveat. */
.badge.accent { color: var(--gold);      border-color: rgba(227, 200, 124, 0.5); }
.badge.good   { color: var(--green-lit); border-color: rgba(95, 157, 118, 0.5); }
.badge.quiet  { color: var(--muted-dim); }

/* The one line of persuasion on a card. Serif italic, because it is a person
   talking, not a data field. */
.note {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.06rem;
  line-height: 1.5;
  color: var(--cream);
  margin: 1.1rem 0 0;
}

.card.alt .note { font-size: 0.98rem; color: var(--muted); }

/* An aside from behind the bar. Quieter than .note and set off by a rule. */
.house-note {
  margin: 0.9rem 0 0;
  padding-left: 0.9rem;
  border-left: 2px solid var(--line);
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.5;
}

.meta { margin-top: 1.25rem; padding-top: 1.15rem; border-top: 1px solid var(--line-soft); }

.meta-row { display: flex; gap: 0.6rem; font-size: 0.88rem; margin-top: 0.5rem; }
.meta-row:first-child { margin-top: 0; }

.meta-key {
  flex: 0 0 auto;
  color: var(--muted-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.66rem;
  padding-top: 0.28rem;
  width: 5.5rem;
}

.meta-val { color: var(--muted); }
.meta-val.price { font-variant-numeric: tabular-nums; color: var(--cream); }

/* Why this was picked. A list, but never rendered with list bullets, the
   gold dot is the mark. */
.why { margin: 1.15rem 0 0; padding: 0; list-style: none; }

.why li {
  position: relative;
  padding-left: 1.3rem;
  color: var(--muted);
  font-size: 0.9rem;
  margin-top: 0.35rem;
}

.why li::before {
  content: "";
  position: absolute;
  left: 0.15rem;
  top: 0.62rem;
  width: 0.42rem;
  height: 0.42rem;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.75;
}

.section-label {
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted-dim);
  margin: 2.5rem 0 1rem;
  display: flex;
  align-items: center;
  gap: 0.9rem;
}

.section-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line-soft);
}

.results-actions {
  display: flex;
  gap: 0.8rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 2.25rem;
}

/* ---------------------------------------------------------------- footer */

.foot {
  margin-top: 3.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--line-soft);
  color: var(--muted-dim);
  font-size: 0.8rem;
  text-align: center;
}

/* ----------------------------------------------------------------- a11y */

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
  border-radius: 4px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------------------------------------------------------------- print */
/* Guests do print these, and a phone screenshot goes to the printer as often
   as the page does. Ink on white, chrome gone. */

@media print {
  body { background: #fff; color: #000; }
  .top, .results-actions, .nav, .foot { display: none; }
  /* A product photo on a sheet of paper is a smear of toner. */
  .shot { display: none; }
  .card { border: 1px solid #ccc; background: #fff; page-break-inside: avoid; }
  .card h3, .note, .meta-val, .why li { color: #000; }
}


/* =========================================================================
   BrunnenBar — Whisky recommender, app-specific styling
   =========================================================================
   Everything that gives the app its look lives in ../assets/brunnenbar-theme.css
   and is shared with the cocktail recommender. This file holds only what is
   true of the whisky app and nothing else.

   Keep it this small. If a rule here would also be right for the cocktail or
   tequila app, it belongs in the theme instead.
   ========================================================================= */

/* Peat has five stops where cocktail strength has six. The theme takes the
   stop count as a variable, so this is the whole override. */
.scale { --scale-cols: 5; --scale-cols-sm: 1; }

/* One stop per row on a phone reads better than five cramped columns, and a
   full width row wants the label first and the pips out to the side. */
.scale-stop { flex-direction: row-reverse; justify-content: space-between; padding: 0.9rem 1.1rem; }
@media (min-width: 34rem) {
  .scale-stop { flex-direction: column; justify-content: center; padding: 0.85rem 0.4rem 0.7rem; }
}

/* The whisky card's badges, mapped onto the theme's three variants. The theme
   deliberately does not know what a peated malt is. */
.badge.rare,
.badge.loved { color: var(--gold);      border-color: rgba(227, 200, 124, 0.5); }
.badge.smoke,
.badge.start { color: var(--green-lit); border-color: rgba(95, 157, 118, 0.5); }
.badge.off   { color: var(--muted-dim); }

/* The smoke row on a result card shows the same pips as the question, so a
   guest can see at a glance how the answer and the bottle line up. */
.meta-val .pips { display: inline-flex; vertical-align: middle; margin-right: 0.5rem; }
.pip-label { vertical-align: middle; }

/* Preview mode has to be impossible to mistake for the real card, so it is
   the one notice that takes the accent rather than the quiet green rule. */
.notice.demo { border-left-color: var(--gold); color: var(--gold); margin-bottom: 1.5rem; }

</style>

<div class="shell">
  <header class="top">
    <nav class="lang" id="lang-toggle" aria-label="Sprache / Language"></nav>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <p id="live" class="sr-only" role="status" aria-live="polite"></p>
</div>

<script>
/*
 * BrunnenBar — the one source
 * =========================================================================
 * Implements the Menu API brief. There is exactly one place drinks, prices,
 * descriptions and allergens come from, and this is the only file that talks
 * to it.
 *
 * Rules from the brief, encoded here rather than left to good intentions:
 *
 *   - Read only. Nothing is ever written back.
 *   - Never ship a bundled copy of the menu as a fallback. A stale copy that
 *     shipped with the app is wrong the moment a price changes, and wrong
 *     silently. The only fallback is the last response this browser actually
 *     received, shown with its age.
 *   - Do not repair encoding. If "&amp;" turns up in the payload the pipeline
 *     is broken upstream, and quietly fixing it here would hide that.
 *   - Never render content.rendered as HTML. Only the <pre> block is read.
 *
 * Exposed as window.BBMenuSource; also loadable in node for the tests.
 * =========================================================================
 */
(function (root) {
  'use strict';

  var MENU_URL = 'https://brunnenbar.com/wp-json/wp/v2/pages/217?_fields=content';

  /* How long a fetched menu is reused before going back to the network.
   * The Menu API doc asks for at most one request an hour, on the grounds

<script>
/*
 * BrunnenBar — Whisky recommender, interface
 * =========================================================================
 * Vanilla JS, no build step, no dependencies. Loads as plain script tags so
 * the page also works opened straight off disk or on an iPad behind the bar.
 *
 * The bottles come from the live Menu API through the shared loader in
 * ../assets/menu-source.js, which is the only file in the project allowed to
 * talk to it. Nothing about the shelf is written into this app. If the card
 * cannot be reached, the page says so and shows the last answer this browser
 * itself received, with its age, and never a copy that shipped with the app.
 * =========================================================================
 */
(function () {
  'use strict';

  var SOURCE = window.BBMenuSource;
  var ENGINE = window.BBWhiskyEngine;
  var QUESTIONS = window.BBWhiskyQuestions.QUESTIONS;
  var UI = window.BBWhiskyQuestions.UI;
  var VALUE_EN = window.BBWhiskyQuestions.VALUE_EN;
  var CARD_URL = 'https://brunnenbar.com/cocktailkarte/';

  // Rank at or under which a bottle is called a favourite on its card.
  var LOVED_RANK = 10;

  /* Preview mode. Explicitly asked for with ?demo=1, loud on every screen,
   * and never reached by a failed fetch. It exists so the app can be looked
   * at before the shelf carries its profiles, and for nothing else. */
  var DEMO = true;   // built as a preview, so this is not a question

  var state = {
    lang: 'de',
    screen: 'loading',
    step: 0,
    answers: {},
    seed: Math.floor(Math.random() * 100000),
    showAll: false,
    pool: [],
    questions: [],
    stale: null,       // {ageMs} when this is the last response, not a fresh one
    failed: false
  };

  var stage = document.getElementById('stage');
  var liveRegion = document.getElementById('live');

  // ------------------------------------------------------------- helpers --

  function t() { return UI[state.lang]; }
  function L(obj) { return obj ? obj[state.lang] : ''; }
  function fill(str, vars) {
    return String(str).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? vars[k] : m;
    });
  }

  /* A field off the row itself, English where the card has it and German
   * where it does not, decided per field so a half translated bottle shows
   * English where it can instead of reverting wholesale. */
  function F(item, key) { return SOURCE.field(item, key, state.lang) || ''; }

  /* The same idea one level down, inside the whisky profile. */
  function P(item, key) {
    var p = ENGINE.profileOf(item) || {};
    if (state.lang === 'en') {
      var en = p[key + '_en'];
      if (typeof en === 'string' ? en : (en && en.length)) return en;
    }
    return p[key];
  }

  /* A single card value such as an origin or a cask, for the places where
   * one value is quoted on its own and there is no parallel English array to
   * read it out of. */
  function V(value) {
    if (state.lang !== 'en' || value == null) return value;
    return VALUE_EN[value] || value;
  }

  /* A profile value ready to show. English from the card where the card has
   * it, otherwise the German value put through the small translation table,
   * so a bottle nobody translated still reads as English where it can. */
  function LV(item, key) {
    var v = P(item, key);
    if (Array.isArray(v)) return v.map(V).join(' · ');
    return V(v) || '';
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2).toLowerCase(), v);
        else node.setAttribute(k, v === true ? '' : v);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null || c === false) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function announce(msg) { if (liveRegion) liveRegion.textContent = msg; }

  function humanAge(ms) {
    var mins = Math.round(ms / 60000);
    if (mins < 90) return fill(t().ageMinutes, { n: Math.max(1, mins) });
    var hours = Math.round(mins / 60);
    if (hours < 36) return fill(t().ageHours, { n: hours });
    return fill(t().ageDays, { n: Math.round(hours / 24) });
  }

  // ------------------------------------------------------------ questions --

  /* The flow the shelf can actually answer. The engine decides which
   * questions and which answers survive, this only turns the price bands it
   * hands back into something a guest can read. */
  function buildQuestions(pool) {
    return ENGINE.tailor(pool, QUESTIONS).map(function (cut) {
      var q = cut.q;
      if (!cut.bands) {
        return cut.options ? shallow(q, { options: cut.options }) : q;
      }
      var byValue = {};
      q.options.forEach(function (o) { byValue[o.value] = o; });
      return shallow(q, {
        type: 'single',
        options: cut.bands.map(function (b) {
          var tpl = byValue[b.value] || byValue['3'];
          return {
            value: b.value,
            label: {
              de: fill(tpl.label.de, { x: SOURCE.formatPrice(b.max) }),
              en: fill(tpl.label.en, { x: SOURCE.formatPrice(b.max) })
            },
            hint: tpl.hint
          };
        })
      });
    });
  }

  function shallow(base, over) {
    var out = {};
    Object.keys(base).forEach(function (k) { out[k] = base[k]; });
    Object.keys(over).forEach(function (k) { out[k] = over[k]; });
    return out;
  }

  function isAnswered(q) {
    var v = state.answers[q.id];
    return q.type === 'multi' ? Array.isArray(v) && v.length > 0 : v != null && v !== '';
  }

  function render() {
    stage.innerHTML = '';
    if (DEMO) stage.appendChild(el('p', { class: 'notice demo', text: t().demo }));
    if (state.screen === 'loading') stage.appendChild(renderLoading());
    else if (state.screen === 'error') stage.appendChild(renderError());
    else if (state.screen === 'intro') stage.appendChild(renderIntro());
    else if (state.screen === 'quiz') stage.appendChild(renderQuiz());
    else stage.appendChild(renderResults());
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // -------------------------------------------------------- plain screens --

  function renderLoading() {
    return el('section', { class: 'intro' }, [
      el('h1', { text: t().title }),
      el('hr', { class: 'rule' }),
      el('p', { class: 'lede', text: t().loading })
    ]);
  }

  function renderError() {
    var noShelf = !state.failed;
    return el('section', { class: 'intro' }, [
      el('h1', { text: t().title }),
      el('hr', { class: 'rule' }),
      el('p', { class: 'lede', text: noShelf ? t().noData : t().offlineFail }),
      el('p', { class: 'q-sub', text: noShelf ? t().noDataSub : '' }),
      el('div', {}, [
        el('a', { class: 'link-card', href: CARD_URL, target: '_blank', rel: 'noopener', text: t().fullCard })
      ])
    ]);
  }

  // --------------------------------------------------------------- intro --

  function renderIntro() {
    var frag = document.createDocumentFragment();
    if (state.stale) {
      frag.appendChild(el('p', {
        class: 'notice', text: fill(t().offline, { x: humanAge(state.stale.ageMs) })
      }));
    }
    frag.appendChild(el('section', { class: 'intro' }, [
      el('h1', { text: t().title }),
      el('hr', { class: 'rule' }),
      el('p', { class: 'lede', text: t().lede }),
      el('button', {
        class: 'btn btn-primary', text: t().start,
        onClick: function () {
          // A shelf too small to ask anything about still deserves an answer.
          state.screen = state.questions.length ? 'quiz' : 'results';
          state.step = 0;
          state.answers = {};
          state.showAll = false;
          state.seed = Math.floor(Math.random() * 100000);
          render();
        }
      }),
      el('div', {}, [
        el('a', { class: 'link-card', href: CARD_URL, target: '_blank', rel: 'noopener', text: t().fullCard })
      ])
    ]));
    return frag;
  }

  // ---------------------------------------------------------------- quiz --

  function renderQuiz() {
    var qs = state.questions;
    var q = qs[state.step];
    if (!q) { state.step = Math.max(0, qs.length - 1); q = qs[state.step]; }
    if (!q) return renderResults();

    var frag = document.createDocumentFragment();

    var pct = ((state.step + 1) / qs.length) * 100;
    frag.appendChild(el('div', { class: 'progress' }, [
      el('div', { class: 'progress-track' }, [
        el('div', { class: 'progress-fill', style: 'width:' + pct + '%' })
      ]),
      el('p', { class: 'progress-label', text: fill(t().step, { n: state.step + 1, total: qs.length }) })
    ]));

    frag.appendChild(el('h2', { class: 'q-title', text: L(q.title) }));
    if (q.sub) frag.appendChild(el('p', { class: 'q-sub', text: L(q.sub) }));

    frag.appendChild(q.type === 'scale' ? renderScale(q) : renderOptions(q));

    var nav = el('div', { class: 'nav' });
    if (state.step > 0) {
      nav.appendChild(el('button', {
        class: 'btn btn-ghost', type: 'button', text: t().back,
        onClick: function () { state.step--; render(); }
      }));
    }
    var right = el('div', { class: 'nav-right' });
    if (q.optional) {
      right.appendChild(el('button', {
        class: 'btn-quiet', type: 'button', text: t().skip,
        onClick: function () {
          state.answers[q.id] = q.type === 'multi' ? [] : '';
          advance();
        }
      }));
    }
    if (q.type === 'multi') {
      right.appendChild(el('button', {
        class: 'btn btn-primary', type: 'button', text: t().next,
        disabled: !q.optional && !isAnswered(q),
        onClick: advance
      }));
    }
    nav.appendChild(right);
    frag.appendChild(nav);

    return frag;
  }

  function renderOptions(q) {
    var multi = q.type === 'multi';
    var current = state.answers[q.id];
    var wrap = el('div', {
      class: 'options' + (q.options.length > 4 ? ' cols-2' : ''),
      role: multi ? 'group' : 'radiogroup',
      'aria-label': L(q.title)
    });
    q.options.forEach(function (opt) {
      var selected = multi
        ? Array.isArray(current) && current.indexOf(opt.value) !== -1
        : current === opt.value;
      wrap.appendChild(el('button', {
        class: 'option' + (opt.wide ? ' option-wide' : ''), type: 'button',
        'aria-pressed': selected ? 'true' : 'false',
        onClick: function () { choose(q, opt.value); }
      }, [
        el('span', { class: 'option-mark', 'aria-hidden': 'true' }),
        el('span', { class: 'option-body' }, [
          el('span', { class: 'option-label', text: L(opt.label) }),
          opt.hint && el('span', { class: 'option-hint', text: L(opt.hint) })
        ])
      ]));
    });
    return wrap;
  }

  /* Five stops for peat, where the cocktail app has six for strength. The
   * theme takes the stop count as a variable, so this is a two line override
   * in styles.css rather than a second copy of the grid. */
  function renderScale(q) {
    var current = state.answers[q.id];
    var wrap = el('div', { class: 'scale', role: 'radiogroup', 'aria-label': L(q.title) });
    q.options.forEach(function (opt, i) {
      wrap.appendChild(el('button', {
        class: 'scale-stop', type: 'button',
        'aria-pressed': current === opt.value ? 'true' : 'false',
        onClick: function () { choose(q, opt.value); }
      }, [
        pipRow(i, q.options.length - 1),
        el('span', { class: 'scale-label', text: L(opt.label) })
      ]));
    });
    return wrap;
  }

  /* Filled pips read as intensity no matter how the grid wraps, which a
   * single rising bar does not once it breaks onto a second row. */
  function pipRow(on, total) {
    var pips = el('span', { class: 'pips', 'aria-hidden': 'true' });
    for (var n = 1; n <= total; n++) {
      pips.appendChild(el('i', { class: n <= on ? 'pip on' : 'pip' }));
    }
    return pips;
  }

  function choose(q, value) {
    if (q.type === 'multi') {
      var list2 = Array.isArray(state.answers[q.id]) ? state.answers[q.id].slice() : [];
      var picked = q.options.filter(function (o) { return o.value === value; })[0];
      var exclusive = q.options.filter(function (o) { return o.exclusive; })
        .map(function (o) { return o.value; });

      if (picked && picked.exclusive) {
        // "Leave it to us" replaces every other pick, and toggles off again.
        list2 = list2.indexOf(value) === -1 ? [value] : [];
      } else {
        var at = list2.indexOf(value);
        if (at === -1) list2.push(value); else list2.splice(at, 1);
        list2 = list2.filter(function (v) { return exclusive.indexOf(v) === -1; });
      }
      state.answers[q.id] = list2;
      render();
      return;
    }
    state.answers[q.id] = value;
    advance();
  }

  function advance() {
    if (state.step >= state.questions.length - 1) {
      state.screen = 'results';
      state.showAll = false;
      render();
      announce(t().results);
    } else {
      state.step++;
      render();
    }
  }

  // ------------------------------------------------------------- results --

  function reasonText(r) {
    var copy = t().reasons[r.key];
    if (!copy) return null;
    var x = r.x;
    if (r.key === 'notes') {
      x = String(r.x).split(', ').map(function (n) { return t().noteNames[n] || n; })
        .join(state.lang === 'de' ? ' und ' : ' and ');
    }
    if (r.key === 'origin' || r.key === 'cask') x = V(r.x);
    return fill(copy, { x: x });
  }

  /* A runner up earns its place by being different, so label it with the
   * difference rather than with "also a good fit". */
  function contrastLabel(item) {
    var c = item.contrast;
    if (!c) return t().alsoGood;
    var copy = t().contrast[c.kind];
    if (!copy) return t().alsoGood;
    var x = c.value;
    if (c.kind === 'note') x = t().noteCompare[c.value] || c.value;
    else x = V(c.value);
    return fill(copy, { x: x });
  }

  function metaRow(key, value, cls) {
    if (!value) return null;
    return el('div', { class: 'meta-row' }, [
      el('span', { class: 'meta-key', text: key }),
      typeof value === 'string'
        ? el('span', { class: 'meta-val' + (cls ? ' ' + cls : ''), text: value })
        : value
    ]);
  }

  /* The bottle photo, where the card has one. Roughly half the rows do not,
   * so a missing image is the normal case and never a gap in the layout.
   *
   * A plain path, an http address, or an image inlined as a data URI is
   * followed. Anything carrying some other scheme is not. The value comes
   * from the card rather than from this app, and a scheme nobody expected has
   * no business being handed to the browser even where it would be inert.
   * An inlined image is allowed because the single file preview build has no
   * second file to point at, and an image is inert either way.
   *
   * The alt text is the bottle's name. A screen reader that has just read
   * the name in the heading does not need it twice, so the image is marked
   * decorative there instead, which is what an empty alt means. */
  function shotOf(item, small) {
    var url = item && item.image;
    if (typeof url !== 'string' || !url) return null;
    // A plain path, an http address, or an inlined image. Anything else has
    // brought its own scheme along and is refused.
    if (/^[a-z][a-z0-9+.\-]*:/i.test(url)
        && !/^https?:/i.test(url)
        && !/^data:image\//i.test(url)) return null;
    return el('figure', { class: 'shot' + (small ? ' shot-sm' : '') }, [
      el('img', {
        src: url, alt: '', loading: 'lazy', decoding: 'async',
        width: '900', height: '900'
      })
    ]);
  }

  function renderCard(item, rank) {
    var d = item.bottle;
    var p = ENGINE.profileOf(d) || {};
    var hero = rank === 0;
    var peat = ENGINE.peatOf(d);

    var badges = el('div', { class: 'badges' });
    if (peat != null && peat >= ENGINE.SMOKE_VISIBLE) {
      badges.appendChild(el('span', { class: 'badge smoke', text: t().badgeSmoke }));
    }
    if (p.level === 'einstieg') {
      badges.appendChild(el('span', { class: 'badge start', text: t().badgeStart }));
    }
    if (p.level === 'rarität') {
      badges.appendChild(el('span', { class: 'badge rare', text: t().badgeRare }));
    }
    if (typeof d.popularity_rank === 'number' && d.popularity_rank <= LOVED_RANK) {
      badges.appendChild(el('span', { class: 'badge loved', text: t().badgeLoved }));
    }
    /* Six of the fifteen bottles sit behind hidden_on_card so the printed
     * card can stay short while the app still recommends the whole back bar.
     * Either flag means the same thing to a guest, that they will not find it
     * on the paper in front of them, so either one earns the badge. */
    if (d.on_printed_menu === false || d.hidden_on_card === true) {
      badges.appendChild(el('span', { class: 'badge off', text: t().notOnCard }));
    }

    /* Two fields on the row are deliberately not shown.
     *
     * `menu_class` is the bar's own star and dog grading by margin. It is an
     * internal number and a guest must never see it, in any form, including
     * as an ordering they could reverse engineer.
     *
     * `recommended` marks the leader of a section on the website. Here it
     * would sit next to our actual recommendation and argue with it, so the
     * app leaves it alone rather than putting two golden claims on one
     * screen. */

    /* Two shapes, both from the theme. The favourite gets the photo across
     * the full width above its name, a runner up gets a thumbnail beside it.
     * A card with no photo simply has neither, and never a placeholder.
     *
     * The badges sit below either arrangement. Squeezed into the space left
     * over next to a bottle they wrap one to a line and the card starts to
     * look like a list of warnings. */
    var photo = shotOf(d, !hero);
    var titleRow = el('div', { class: 'card-top' }, [
      el('h3', { text: F(d, 'name') }),
      el('span', { class: 'match', text: fill(t().match, { n: item.match }) })
    ]);

    var lead;
    if (!photo) lead = [titleRow];
    else if (hero) lead = [photo, titleRow];
    else lead = [el('div', { class: 'card-lead' }, [
      photo, el('div', { class: 'card-lead-body' }, [titleRow])
    ])];

    var children = [
      el('p', { class: 'card-rank', text: hero ? t().topPick : contrastLabel(item) })
    ].concat(lead, [
      badges.childNodes.length ? badges : null,
      F(d, 'description') && el('p', { class: 'note', text: F(d, 'description') })
    ]);

    if (hero && F(d, 'bartender_note')) {
      children.push(el('p', { class: 'house-note', text: F(d, 'bartender_note') }));
    }

    var meta = el('div', { class: 'meta' }, [
      metaRow(t().keyOrigin, LV(d, 'origin'))
    ].filter(Boolean));

    if (hero) {
      var age = ENGINE.ageOf(d);
      [
        metaRow(t().keyKind, LV(d, 'kind')),
        metaRow(t().keyCask, LV(d, 'cask')),
        metaRow(t().keyAge, age != null ? fill(t().ageYears, { n: age })
          : (p.age_years === null ? t().ageNas : '')),
        metaRow(t().keyAbv, typeof p.abv === 'number'
          ? String(p.abv).replace('.', ',') + ' %' : ''),
        peat != null ? el('div', { class: 'meta-row' }, [
          el('span', { class: 'meta-key', text: t().keySmoke }),
          el('span', { class: 'meta-val' }, [
            pipRow(peat, 4),
            el('span', { class: 'pip-label', text: t().peatNames[peat] || '' })
          ])
        ]) : null,
        metaRow(t().keyServe, LV(d, 'serve'))
      ].forEach(function (row) { if (row) meta.appendChild(row); });
    }

    var prices = SOURCE.priceList(d);
    if (prices.length) {
      meta.appendChild(el('div', { class: 'meta-row' }, [
        el('span', { class: 'meta-key', text: t().keyPrice }),
        el('span', { class: 'meta-val price', text: prices.join(' · ') })
      ]));
    }
    if (meta.childNodes.length) children.push(meta);

    if (hero) {
      var why = el('ul', { class: 'why' });
      item.reasons.forEach(function (r) {
        var txt = reasonText(r);
        if (txt) why.appendChild(el('li', { text: txt }));
      });
      if (why.childNodes.length) children.push(why);
    }

    return el('article', { class: 'card' + (hero ? ' hero' : ' alt') }, children.filter(Boolean));
  }

  function renderResults() {
    var res = ENGINE.recommend(state.pool, state.answers, {
      seed: state.seed,
      limit: state.showAll ? 8 : 3
    });

    var frag = document.createDocumentFragment();
    if (state.stale) {
      // Prices move. A guest reading an old one has to know it is old.
      frag.appendChild(el('p', {
        class: 'notice', text: fill(t().offline, { x: humanAge(state.stale.ageMs) })
      }));
    }
    frag.appendChild(el('div', { class: 'results-head' }, [
      el('h2', { text: res.items.length ? t().results : t().empty }),
      (res.items.length ? t().resultsSub : t().emptySub)
        ? el('p', { text: res.items.length ? t().resultsSub : t().emptySub })
        : null
    ].filter(Boolean)));

    if (res.relaxed === 'origin') frag.appendChild(el('p', { class: 'notice', text: t().loosenedOrigin }));
    if (res.relaxed === 'level') frag.appendChild(el('p', { class: 'notice', text: t().loosenedLevel }));
    if (res.smokeGap) frag.appendChild(el('p', { class: 'notice', text: t().smokeGap }));

    res.items.forEach(function (item, i) { frag.appendChild(renderCard(item, i)); });

    var actions = el('div', { class: 'results-actions' });
    if (!state.showAll && res.total > res.items.length) {
      actions.appendChild(el('button', {
        class: 'btn btn-ghost', type: 'button', text: t().moreOptions,
        onClick: function () { state.showAll = true; render(); }
      }));
    }
    actions.appendChild(el('button', {
      class: 'btn btn-primary', type: 'button', text: t().restart,
      onClick: function () { state.screen = 'intro'; render(); }
    }));
    actions.appendChild(el('a', {
      class: 'btn btn-ghost', href: CARD_URL, target: '_blank', rel: 'noopener', text: t().fullCard
    }));
    frag.appendChild(actions);
    frag.appendChild(el('p', { class: 'foot', text: t().footer }));

    return frag;
  }

  // ------------------------------------------------------------- chrome ---

  function renderChrome() {
    var host = document.getElementById('lang-toggle');
    host.innerHTML = '';
    ['de', 'en'].forEach(function (code) {
      host.appendChild(el('button', {
        type: 'button', text: code.toUpperCase(),
        'aria-pressed': state.lang === code ? 'true' : 'false',
        'aria-label': code === 'de' ? 'Deutsch' : 'English',
        onClick: function () {
          state.lang = code;
          document.documentElement.lang = code;
          try { localStorage.setItem('bb-lang', code); } catch (e) { /* private mode */ }
          state.questions = buildQuestions(state.pool);
          renderChrome();
          render();
        }
      }));
    });
  }

  // ---------------------------------------------------------------- load --

  function adopt(menu) {
    state.pool = ENGINE.bottles(SOURCE.allItems(menu));
    state.questions = buildQuestions(state.pool);
    state.screen = state.pool.length ? 'intro' : 'error';
    render();
  }

  /* Preview only, and only when the address bar asked for it. The file is
   * fetched on demand rather than shipped in the page, so there is no copy
   * of a menu sitting in the app waiting to be used as a fallback. */
  function loadDemo() {
    adopt(window.BBWhiskyDemo.menu);   // bundled in, nothing to fetch
  }

  function loadLive() {
    SOURCE.loadMenu().then(function (out) {
      if (out.fromCache) state.stale = { ageMs: out.ageMs };
      adopt(out.menu);
    }, function () {
      state.failed = true;
      state.screen = 'error';
      render();
    });
  }

  // ---------------------------------------------------------------- init --

  try {
    var saved = localStorage.getItem('bb-lang');
    if (saved === 'de' || saved === 'en') state.lang = saved;
    else if ((navigator.language || '').slice(0, 2).toLowerCase() !== 'de') state.lang = 'en';
  } catch (e) { /* private mode, stay on the German default */ }

  document.documentElement.lang = state.lang;
  renderChrome();
  render();
  loadDemo();   // a preview never reaches for the Menu API
})();

</script>
