# The tests are plain node with no runner and no dependencies, which is a
# deliberate choice (see CLAUDE.md). That makes this workflow short, and it
# also means there is nothing to install before running it.
#
# Test files are discovered rather than listed, so a new suite is picked up by
# being named *.test.js and nothing here has to be edited.
name: tests

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run every test suite
        run: |
          set -u
          found=0
          failed=0
          # -print0 and read -d so a path with a space cannot split a filename.
          while IFS= read -r -d '' file; do
            found=$((found + 1))
            echo "::group::$file"
            if node "$file"; then :; else failed=$((failed + 1)); fi
            echo "::endgroup::"
          done < <(find . -name '*.test.js' -not -path './.git/*' -print0 | sort -z)

          echo "$found suite(s) run, $failed failed"
          # A run that found nothing is a broken workflow, not a green build.
          if [ "$found" -eq 0 ]; then echo "no test files found"; exit 1; fi
          exit $((failed > 0))
